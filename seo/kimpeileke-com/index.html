<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - kimpeileke.com</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        /* Main card container */
        .coming-soon-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 
                0 20px 25px -5px rgba(0, 0, 0, 0.1),
                0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .coming-soon-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 25px 30px -5px rgba(0, 0, 0, 0.15),
                0 15px 15px -5px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Typography */
        .main-heading {
            font-size: 2.25rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 1.5rem;
            letter-spacing: -0.025em;
        }

        .subtitle {
            font-size: 1.125rem;
            color: #4a5568;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .early-message {
            font-size: 1rem;
            color: #718096;
            margin-bottom: 2.5rem;
            padding: 1.25rem;
            background: rgba(237, 242, 247, 0.8);
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        /* Contact section */
        .contact-section {
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            padding-top: 2rem;
        }

        .contact-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .contact-email {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.125rem;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border: 2px solid #667eea;
            border-radius: 8px;
            transition: all 0.2s ease;
            background: transparent;
        }

        .contact-email:hover {
            background: #667eea;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .contact-email:active {
            transform: translateY(0);
        }

        /* Email icon */
        .email-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .coming-soon-card {
                padding: 2rem 1.5rem;
                margin: 10px;
            }

            .main-heading {
                font-size: 1.875rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .contact-email {
                font-size: 1rem;
                padding: 0.625rem 1.25rem;
            }
        }

        @media (max-width: 480px) {
            .coming-soon-card {
                padding: 1.5rem 1rem;
            }

            .main-heading {
                font-size: 1.5rem;
            }

            .early-message {
                padding: 1rem;
            }
        }

        /* Subtle animation for page load */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .coming-soon-card {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="coming-soon-card">
        <h1 class="main-heading">Coming Soon</h1>
        <p class="subtitle">Coming Soon - kimpeileke.com</p>
        
        <div class="early-message">
            <strong>You've reached us before we're ready!</strong><br>
            We're working hard to bring you something amazing. Stay tuned for our official launch.
        </div>

        <div class="contact-section">
            <div class="contact-label">Get in Touch</div>
            <a href="mailto:info@kimpeileke.com" class="contact-email">
                <svg class="email-icon" viewBox="0 0 24 24">
                    <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                info@kimpeileke.com
            </a>
        </div>
    </div>
</body>
</html>
