<style>
/* ============================================
   VARIABLES
   ============================================ */
:root {
  --font-serif: 'Source Serif 4', Georgia, serif;
  --font-sans: 'Outfit', -apple-system, sans-serif;
  --font-mono: 'Geist Mono', 'SF Mono', monospace;
  --ease: cubic-bezier(0.25, 1, 0.5, 1);
  --max-w: 1080px;
}

[data-theme="dark"] {
  --bg: #141517;
  --bg-alt: #1a1b1e;
  --bg-hover: #1e1f23;
  --border: #27282c;
  --border-hover: #35363b;
  --text-1: #e8e6e1;
  --text-2: #9a978f;
  --text-3: #5f5d57;
  --accent: #c9a84c;
  --accent-dim: rgba(201, 168, 76, 0.12);
  --tag-tool: #7ea3d1;
  --tag-data: #6dbfa3;
  --tag-app: #c490d4;
  --tag-auth: #d19a7e;
  --tag-infra: #7ebfd1;
}

[data-theme="light"] {
  --bg: #faf9f6;
  --bg-alt: #f3f1ec;
  --bg-hover: #edeae3;
  --border: #e0ddd5;
  --border-hover: #d0cdc5;
  --text-1: #1c1b19;
  --text-2: #6b6860;
  --text-3: #a09d95;
  --accent: #9a7d2e;
  --accent-dim: rgba(154, 125, 46, 0.08);
  --tag-tool: #4a7bb5;
  --tag-data: #3a8f73;
  --tag-app: #9a5eab;
  --tag-auth: #b57a5a;
  --tag-infra: #4a9ab5;
}

/* ============================================
   RESET
   ============================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-1);
  line-height: 1.6;
  transition: background 0.4s var(--ease), color 0.4s var(--ease);
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }
::selection { background: var(--accent); color: var(--bg); }

/* ============================================
   LAYOUT
   ============================================ */
.container {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 clamp(24px, 4vw, 48px);
}

/* ============================================
   HEADER
   ============================================ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  transition: background 0.4s var(--ease);
}

.header-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 clamp(24px, 4vw, 48px);
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.site-name {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.3px;
}

.site-name-dot { color: var(--accent); }

.header-right {
  display: flex;
  align-items: center;
  gap: 4px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  transition: color 0.2s ease, background 0.2s ease;
}
.icon-btn:hover { color: var(--text-2); background: var(--bg-alt); }
.icon-btn svg { width: 20px; height: 20px; }

.icon-btn .icon-moon,
[data-theme="light"] .icon-btn .icon-sun { display: none; }
[data-theme="light"] .icon-btn .icon-moon { display: block; }

/* ============================================
   INTRO
   ============================================ */
.intro {
  padding: 80px 0 56px;
  border-bottom: 1px solid var(--border);
}

.intro-label {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
  opacity: 0;
  transform: translateY(8px);
  animation: fadeIn 0.6s var(--ease) 0.1s forwards;
}

.intro-heading {
  font-family: var(--font-serif);
  font-size: clamp(36px, 5vw, 52px);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.8px;
  margin-bottom: 16px;
  opacity: 0;
  transform: translateY(8px);
  animation: fadeIn 0.6s var(--ease) 0.2s forwards;
}

.intro-body {
  font-size: 18px;
  line-height: 1.75;
  color: var(--text-2);
  max-width: 680px;
  opacity: 0;
  transform: translateY(8px);
  animation: fadeIn 0.6s var(--ease) 0.3s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================
   CONTROLS
   ============================================ */
.controls {
  padding: 36px 0 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
  opacity: 0;
  transform: translateY(8px);
  animation: fadeIn 0.6s var(--ease) 0.45s forwards;
}

.search-wrap {
  position: relative;
}

.search-wrap svg {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--text-3);
  pointer-events: none;
}

.search-input {
  width: 100%;
  height: 52px;
  padding: 0 52px 0 48px;
  font-size: 16px;
  color: var(--text-1);
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.search-input::placeholder { color: var(--text-3); }
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

.search-key {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: 5px;
  pointer-events: none;
  transition: opacity 0.15s ease;
}
.search-input:focus ~ .search-key { opacity: 0; }

.filter-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.filter-btn {
  font-size: 15px;
  font-weight: 400;
  padding: 8px 20px;
  border-radius: 100px;
  color: var(--text-3);
  border: 1px solid transparent;
  transition: all 0.25s var(--ease);
}
.filter-btn:hover { color: var(--text-2); }
.filter-btn.active {
  color: var(--text-1);
  border-color: var(--border);
  background: var(--bg-alt);
}

/* ============================================
   RESULTS COUNT
   ============================================ */
.results-line {
  padding: 28px 0 0;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-3);
  letter-spacing: 0.3px;
}

/* ============================================
   PROJECT LIST
   ============================================ */
.project-list {
  padding: 8px 0 80px;
  list-style: none;
}

.project-item {
  border-bottom: 1px solid var(--border);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
}

.project-item.visible {
  opacity: 1;
  transform: translateY(0);
}

.project-link {
  display: block;
  padding: 36px 0;
  transition: background 0.2s ease;
  position: relative;
}

.project-link::before {
  content: '';
  position: absolute;
  inset: 0 -24px;
  border-radius: 8px;
  background: var(--bg-hover);
  opacity: 0;
  transition: opacity 0.25s ease;
  z-index: -1;
}

.project-link:hover::before { opacity: 1; }

.project-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.project-name {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.3px;
  transition: color 0.2s ease;
}

.project-link:hover .project-name { color: var(--accent); }

.project-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.project-category {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 4px;
  background: var(--accent-dim);
  color: var(--accent);
}

.project-date {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--text-3);
  white-space: nowrap;
}

.project-desc {
  font-size: 16px;
  line-height: 1.75;
  color: var(--text-2);
  margin-top: 4px;
}

.project-tech {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}

.project-tech span {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-3);
  letter-spacing: 0.2px;
}

.project-tech span + span::before {
  content: '·';
  margin-right: 8px;
  color: var(--border-hover);
}

/* Arrow on hover */
.project-arrow {
  position: absolute;
  right: -8px;
  top: 50%;
  transform: translateY(-50%) translateX(-4px);
  opacity: 0;
  color: var(--accent);
  transition: all 0.3s var(--ease);
}
.project-arrow svg { width: 20px; height: 20px; }
.project-link:hover .project-arrow {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}

/* ============================================
   EMPTY STATE
   ============================================ */
.empty-state {
  text-align: center;
  padding: 64px 0;
  color: var(--text-3);
}
.empty-state p:first-child {
  font-family: var(--font-serif);
  font-size: 18px;
  color: var(--text-2);
  margin-bottom: 4px;
}
.empty-state p:last-child { font-size: 14px; }

/* ============================================
   FOOTER
   ============================================ */
.site-footer {
  border-top: 1px solid var(--border);
  padding: 28px 0;
}

.footer-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 clamp(24px, 4vw, 48px);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-text {
  font-size: 14px;
  color: var(--text-3);
}

.footer-links { display: flex; gap: 20px; }
.footer-links a {
  font-size: 14px;
  color: var(--text-3);
  transition: color 0.2s ease;
}
.footer-links a:hover { color: var(--accent); }

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width: 600px) {
  .intro { padding: 48px 0 36px; }
  .project-top { flex-direction: column; gap: 6px; }
  .project-meta { order: -1; }
  .project-arrow { display: none; }
  .search-key { display: none; }
  .footer-inner { flex-direction: column; gap: 12px; align-items: flex-start; }
}

/* ============================================
   SCROLLBAR
   ============================================ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

// Sort by date descending
projects.sort((a, b) => b.date.localeCompare(a.date));

const searchInput = document.getElementById('searchInput');
const filterRow = document.getElementById('filterRow');
const projectList = document.getElementById('projectList');
const resultsLine = document.getElementById('resultsLine');

let activeFilter = 'all';
let query = '';

function formatDate(d) {
  const [y, m] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m)-1]} ${y}`;
}

function getFiltered() {
  return projects.filter(p => {
    const catOk = activeFilter === 'all' || p.category === activeFilter;
    const qOk = !query ||
      p.name.toLowerCase().includes(query) ||
      p.desc.toLowerCase().includes(query) ||
      p.tech.some(t => t.toLowerCase().includes(query)) ||
      p.categoryLabel.toLowerCase().includes(query);
    return catOk && qOk;
  });
}

function render() {
  const filtered = getFiltered();
  resultsLine.textContent = `${filtered.length} project${filtered.length !== 1 ? 's' : ''}`;

  if (!filtered.length) {
    projectList.innerHTML = `
      <li class="empty-state" style="list-style:none">
        <p>No matching projects</p>
        <p>Try a different search term or category</p>
      </li>`;
    return;
  }

  projectList.innerHTML = filtered.map((p, i) => `
    <li class="project-item" style="transition-delay: ${Math.min(i * 30, 300)}ms">
      <a href="https://github.com/${p.repo}" class="project-link" target="_blank" rel="noopener">
        <div class="project-top">
          <span class="project-name">${p.name}</span>
          <div class="project-meta">
            <span class="project-category">${p.categoryLabel}</span>
            <span class="project-date">${formatDate(p.date)}</span>
          </div>
        </div>
        <p class="project-desc">${p.desc}</p>
        <div class="project-tech">${p.tech.map(t => `<span>${t}</span>`).join('')}</div>
        <div class="project-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
      </a>
    </li>
  `).join('');

  requestAnimationFrame(() => {
    projectList.querySelectorAll('.project-item').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), i * 30);
    });
  });
}

// Search
searchInput.addEventListener('input', e => {
  query = e.target.value.toLowerCase().trim();
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.blur();
    searchInput.value = '';
    query = '';
    render();
  }
});

// Filters
filterRow.addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  filterRow.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  render();
});

// Theme
const themeToggle = document.getElementById('themeToggle');
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
}
themeToggle.addEventListener('click', () => {
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
const saved = localStorage.getItem('theme');
if (saved) setTheme(saved);

render();
</script>
